server:
  # Render (and most PaaS) inject PORT; default 8080 for local.
  port: ${PORT:8080}

spring:
  data:
    mongodb:
      # Must include a DB name in the path, e.g. ...mongodb.net/ubi_billing?...
      # If the URI omits it, spring.data.mongodb.database is used as fallback.
      uri: ${MONGODB_URI:mongodb://localhost:27017/ubi_billing}
      database: ${MONGODB_DATABASE:ubi_billing}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  ai:
    # none unless GEMINI_API_KEY is set (see GeminiChatEnvironmentPostProcessor)
    # or SPRING_AI_MODEL_CHAT=google-genai is exported.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        # Prefer GEMINI_API_KEY. Spring AI standard: SPRING_AI_GOOGLE_GENAI_API_KEY.
        api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.2

stripe:
  # Prefer application-local.yml (gitignored) with profile `local`, or set STRIPE_SECRET_KEY.
  secret-key: ${STRIPE_SECRET_KEY:}
  # Must match the event_name configured on the Stripe Billing Meter.
  telematics-meter-event-name: ${STRIPE_TELEMATICS_METER_EVENT_NAME:ubi_telematics_usage}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}

analytics:
  # Aggregation maxTimeMS. Phase A uses the primary Mongo URI unless overridden.
  max-time-ms: ${ANALYTICS_MAX_TIME_MS:5000}
  default-limit: ${ANALYTICS_DEFAULT_LIMIT:50}
  mongodb:
    # Optional read-only URI. Empty / unset falls back to spring.data.mongodb.uri.
    uri: ${ANALYTICS_MONGODB_URI:}
  cache:
    enabled: ${ANALYTICS_CACHE_ENABLED:true}
    ttl-seconds: ${ANALYTICS_CACHE_TTL_SECONDS:3600}
    key-prefix: ${ANALYTICS_CACHE_KEY_PREFIX:analytics:ask:}
  llm:
    summary-max-rows: ${ANALYTICS_SUMMARY_MAX_ROWS:8}
    summary-max-value-chars: ${ANALYTICS_SUMMARY_MAX_VALUE_CHARS:80}

billing:
  retry:
    fixed-delay-ms: ${BILLING_RETRY_FIXED_DELAY_MS:60000}
  # Fallback only when the dashboard does not send returnOrigin (e.g. curl).
  checkout-success-url: ${BILLING_CHECKOUT_SUCCESS_URL:http://localhost:5173/?billing=success}
  checkout-cancel-url: ${BILLING_CHECKOUT_CANCEL_URL:http://localhost:5173/?billing=cancelled}
  # Extra dashboard origins (comma-separated). Also auto-allows localhost, LAN,
  # tunnels, and *.vercel.app / *.netlify.app / *.onrender.com over HTTPS.
  allowed-return-origins: ${BILLING_ALLOWED_RETURN_ORIGINS:}
